name: Pull Request
on:
  pull_request:
    branches:
      - main
    paths:
      - Gemfile.lock

jobs:
  sync:
    name: Sync version
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    permissions:
      contents: read
    env:
      BUNDLE_ONLY: sync

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false
      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1.335.0
        with:
          bundler-cache: true
          cache-version: sync
          ruby-version: ruby
      - name: Create a token for the version bump
        id: token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
      - name: Run version sync rake task
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: bundle exec rake sync_version
