name: Check Lockfile

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/**

permissions:
  contents: read

jobs:
  verify:
    name: Check the actions lockfile matches the workflows
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install gh actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock
      - name: Verify the actions lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify
