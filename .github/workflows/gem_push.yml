name: Ruby Gem

on:
  workflow_call:

jobs:
  build:
    name: Release gem
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    environment: release

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1.332.0
        with:
          bundler-cache: true
          cache-version: package
          ruby-version: ruby
      - name: Publish to RubyGems
        uses: rubygems/release-gem@v1.4.1
