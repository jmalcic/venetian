name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - '3.3'
          - '3.4'
          - '4.0'

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the default task
        run: bundle exec rake

  rails:
    runs-on: ubuntu-latest
    name: Rails ${{ matrix.rails }}
    strategy:
      matrix:
        rails:
          - '7.1'
          - '7.2'
          - '8.0'
    env:
      BUNDLE_LOCKFILE: Gemfile.rails.lock
      RAILS_VERSION: ~> ${{ matrix.rails }}.0

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler: latest
          bundler-cache: true
      - name: Run the tests
        run: bundle exec rake test

  windows:
    runs-on: windows-latest
    name: Windows command quoting (Ruby ${{ matrix.ruby }})
    strategy:
      matrix:
        ruby:
          - '3.3'
          - '4.0'

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the command quoting tests
        run: bundle exec rake test
        env:
          N: /cli_command/
